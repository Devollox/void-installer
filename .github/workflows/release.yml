name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check if release already exists
        id: check
        run: |
          if gh release view "${{ github.ref_name }}" \
                 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: preflight
    if: needs.preflight.outputs.exists == 'false'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            wails_platform: windows/amd64
          - platform: macos
            os: macos-latest
            wails_platform: darwin/universal
          - platform: linux
            os: ubuntu-22.04
            wails_platform: linux/amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Sync version
        run: node scripts/sync-version.js

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            gcc \
            pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: wails build -clean -platform ${{ matrix.wails_platform }}

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: wails build -clean -platform ${{ matrix.wails_platform }}

      - name: Ad-hoc sign macOS app
        if: matrix.platform == 'macos'
        run: codesign --force --deep --sign - "build/bin/Void Presence Installer.app"

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: wails build -clean -platform ${{ matrix.wails_platform }}

      - name: Extract version
        id: ver
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Windows Setup
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mv "build/bin/Void.Presence.Installer.exe" \
             "build/bin/Void.Presence.Installer.${{ steps.ver.outputs.version }}.exe"

      - name: Prepare macOS Setup
        if: matrix.platform == 'macos'
        run: |
          APP_PATH="build/bin/Void Presence Installer.app"
          DMG_PATH="build/bin/Void.Presence.Installer.${{ steps.ver.outputs.version }}.dmg"
          hdiutil create -volname "Void Presence" \
            -srcfolder "$APP_PATH" \
            -ov -format UDBZ "$DMG_PATH"

      - name: Prepare Linux Setup
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          INSTALLER_BIN="build/bin/Void.Presence.Installer"
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p pkg/void-presence/DEBIAN
          mkdir -p pkg/void-presence/usr/bin
          cp "$INSTALLER_BIN" "pkg/void-presence/usr/bin/void-presence"
          chmod 755 "pkg/void-presence/usr/bin/void-presence"
          cat > pkg/void-presence/DEBIAN/control <<EOF
          Package: void-presence
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Devollox <dev@voidpresence.com>
          Description: Void Presence Discord Rich Presence manager
          EOF
          dpkg-deb --build pkg/void-presence "build/bin/Void.Presence.Installer.${VERSION}.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            build/bin/Void.Presence.Installer.*.exe
            build/bin/Void.Presence.Installer.*.dmg
            build/bin/Void.Presence.Installer.*.deb
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show collected artifacts
        run: find dist -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
